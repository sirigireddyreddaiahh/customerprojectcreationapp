applications:
  - name: customer-project-backend-old
    path: .
    routes:
      - route: customer-project-backend-old.cfapps.us10-001.hana.ondemand.com
    memory: 256M
    disk-quota: 512M
    instances: 1
    buildpacks:
      - nodejs_buildpack
    command: npm start
    health-check-type: http
    health-check-http-endpoint: /health
    env:
      NODE_ENV: production
